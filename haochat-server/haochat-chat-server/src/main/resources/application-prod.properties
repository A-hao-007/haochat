server.port=${SERVER_PORT:8080}

# Tomcat默认max-threads=200/min-spare=10，是按多核大流量场景给的默认值，
# 2核4G机型：核数不变(仍2核)，但内存翻倍(2G→4G)给了堆更多余量，
# 相应上调线程数以支撑更多并发连接，避免CPU还有余量时先被并发数卡住
server.tomcat.threads.max=80
server.tomcat.threads.min-spare=8
server.tomcat.accept-count=80

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:haochat}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:haochat}
spring.datasource.password=${MYSQL_PASSWORD:haochat_change_me}
# innodb-buffer-pool-size已从64M提到256M(2核4G机型)，MySQL能扛住的并发连接数随之提高，
# 但Hikari默认maximum-pool-size=10仍偏高，按经验公式((核数*2)+有效磁盘数)取值，保守上调到10
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

spring.redis.host=${REDIS_HOST:redis}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}

