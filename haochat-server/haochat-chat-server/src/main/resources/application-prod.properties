server.port=${SERVER_PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:haochat}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:haochat}
spring.datasource.password=${MYSQL_PASSWORD:haochat_change_me}

spring.redis.host=${REDIS_HOST:redis}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}

haochat.mysql.ip=${MYSQL_HOST:mysql}
haochat.mysql.port=${MYSQL_PORT:3306}
haochat.mysql.db=${MYSQL_DATABASE:haochat}
haochat.mysql.username=${MYSQL_USER:haochat}
haochat.mysql.password=${MYSQL_PASSWORD:haochat_change_me}

haochat.redis.host=${REDIS_HOST:redis}
haochat.redis.port=${REDIS_PORT:6379}
haochat.redis.password=${REDIS_PASSWORD:}

haochat.jwt.secret=${JWT_SECRET:change-this-secret}

oss.enabled=${OSS_ENABLED:true}
oss.type=minio
oss.endpoint=${MINIO_ENDPOINT:http://minio:9000}
oss.access-key=${MINIO_ACCESS_KEY:minioadmin}
oss.secret-key=${MINIO_SECRET_KEY:minioadmin}
oss.bucketName=${MINIO_BUCKET:haochat}

rocketmq.name-server=${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:haochat-producer}
rocketmq.producer.send-message-timeout=${ROCKETMQ_SEND_TIMEOUT:3000}
rocketmq.access-key=${ROCKETMQ_ACCESS_KEY:}
rocketmq.secret-key=${ROCKETMQ_SECRET_KEY:}

wx.mp.callback=${WX_MP_CALLBACK:http://localhost:8080/}
wx.mp.use-redis=false
wx.mp.configs[0].app-id=${WX_MP_APP_ID:disabled-app}
wx.mp.configs[0].secret=${WX_MP_SECRET:disabled-secret}
wx.mp.configs[0].token=${WX_MP_TOKEN:disabled-token}
wx.mp.configs[0].aes-key=${WX_MP_AES_KEY:disabled-aes-key}

haochat.wx.callback=${WX_MP_CALLBACK:http://localhost:8080/}
haochat.wx.appId=${WX_MP_APP_ID:disabled-app}
haochat.wx.secret=${WX_MP_SECRET:disabled-secret}
haochat.wx.token=${WX_MP_TOKEN:disabled-token}
haochat.wx.aesKey=${WX_MP_AES_KEY:disabled-aes-key}

chatai.chatgpt.use=false
chatai.chatgpt.AIUserId=10001
chatai.chatgpt.key=
chatai.chatgpt.proxyUrl=

haochat.deepseek.use=${DEEPSEEK_ENABLED:false}
haochat.deepseek.uid=10001
haochat.deepseek.key=${DEEPSEEK_KEY:}
haochat.deepseek.url=https://api.deepseek.com/v1/chat/completions
haochat.deepseek.model=deepseek-chat
haochat.deepseek.timeout=60
haochat.deepseek.max-tokens=2048
haochat.deepseek.limit=30
